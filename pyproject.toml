[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mgnify-bgcs-common-core"
description = "Shared core utilities for MGnify BGCs"
dynamic = ["version"]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Santiago Sanchez Fragoso", email = "fragoso@ebi.ac.uk" },
    { name = "MGnify team", email = "metagenomics-help@ebi.ac.uk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.83",
  "pydantic>=2",
  "pydantic-settings>=2",
  "PyYAML>=6",
]

[project.optional-dependencies]
ml = [
  # Metric primitives + losses that pull in the ML stack. Kept as an extra so
  # the portal / ETL side of the monorepo can install common-core without torch.
  "torch>=2.7",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
]
hpc-cpu = [
  "numpy>=2.0",
  "scipy>=1.13",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "pyarrow>=15",
  "joblib>=1.4",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
contig-length-filter = "common_core.contig_length_filter:main"
bgc-cluster          = "common_core.clustering.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.setuptools.package-data]
common_core = ["npc/data/*.tsv"]

[tool.deptry.package_module_name_map]
biopython = "Bio"
python-igraph = "igraph"
scikit-learn = "sklearn"
