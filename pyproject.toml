[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mgnify-bgcs-common-core"
description = "Shared core utilities for MGnify BGCs"
dynamic = ["version"]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Santiago Sanchez Fragoso", email = "fragoso@ebi.ac.uk" },
    { name = "MGnify team", email = "metagenomics-help@ebi.ac.uk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.83",
  "pydantic>=2",
  "pydantic-settings>=2",
  "PyYAML>=6",
]

[project.optional-dependencies]
hpc-cpu = [
  "numpy>=2.0",
  "scipy>=1.13",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "pyarrow>=15",
  "joblib>=1.4",
]
dev = [
  "pytest>=9.0.3,<10",
  "ruff==0.17.2",
]

[project.scripts]
contig-length-filter = "common_core.contig_length_filter:main"
bgc-cluster          = "common_core.clustering.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.setuptools.package-data]
common_core = ["npc/data/*.tsv"]

[tool.deptry.package_module_name_map]
biopython = "Bio"
python-igraph = "igraph"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# ruff format owns line length; long strings and comments are left alone.
# UP047 (PEP 695 generics) is cosmetic.
ignore = ["E501", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Imports after pytest.importorskip(); short loop names in assertions.
"tests/*" = ["E402", "E741"]

[tool.ruff.lint.flake8-bugbear]
# A frozen dataclass: safe as a default argument.
extend-immutable-calls = ["common_core.config_loader.LoaderOptions"]
