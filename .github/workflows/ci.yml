name: CI

# Runs on every PR and every push to dev/main.

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # hpc-cpu brings scipy/pyarrow/igraph, without which the clustering
      # tests skip.
      - name: Install
        run: pip install -e ".[dev,hpc-cpu]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
      - name: pytest
        run: pytest -q
      - name: mypy (common_core)
        run: mypy
